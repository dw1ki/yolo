tunnel: yolo-api
credentials-file: C:\Users\YUNINDRA EKA\.cloudflared\4079097c-e520-40bc-bb33-0fb886109c76.json

# Serve YOLO API lewat Cloudflare Tunnel.
# Pastikan Python API berjalan di http://localhost:8000 sebelum tunnel dijalankan.

# QUIC has been unstable on this network; use HTTP/2 for a more predictable tunnel.
protocol: http2

# Origin request settings are applied to the published application below.
originRequest:
  connectTimeout: 600s        # ⭐ INCREASED: 10 minutes (dari 30s) untuk large file uploads
  readTimeout: 600s           # ⭐ NEW: 10 minutes untuk prevent timeout pada long processing
  writeTimeout: 600s          # ⭐ NEW: 10 minutes untuk prevent timeout saat streaming responses
  keepAliveTimeout: 600s      # ⭐ INCREASED: 10 minutes (dari 120s) untuk stable connections
  tcpKeepAlive: 30s          # Keep: 30s untuk maintain connection health
  disableChunkedEncoding: false
  # ⭐ NEW: Settings untuk large file streaming
  maxIdleConnections: 100
  idleConnTimeout: 30s

ingress:
  - hostname: yoloapi.my.id
    service: http://localhost:8000
  - service: http_status:404

# ⭐ Logging untuk debug timeout issues
loglevel: info
transport-loglevel: warn

